[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrax"
version = "3.1.0"
description = "Suite de cybersécurité professionnelle avec 10 scanners réseau"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Patrick Ndaye", email = "patrickndaye919@gmail.com"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.28.0",
    "dnspython>=2.2.0",
    "flask>=2.2.0",
    "flask-cors>=4.0.0",
    "pyjwt>=2.8.0",
    "pyotp>=2.8.0",
    "qrcode>=7.4.0",
    "pillow>=9.0.0",
    "reportlab>=4.0.0",
    "werkzeug>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
expert = [
    "scapy>=2.5.0",
]
osint = [
    "shodan>=1.28.0",
    "censys>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=5.0.0",
    "black>=22.0.0",
]

[project.urls]
Homepage = "https://github.com/Ndaye12/SentraX"
Repository = "https://github.com/Ndaye12/SentraX.git"
Issues = "https://github.com/Ndaye12/SentraX/issues"
Documentation = "https://ndaye12.github.io/SentraX/docs.html"

[project.scripts]
sentrax = "launcher:main"
sentrax-api = "web.api:main"

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=sentrax --cov-report=term-missing"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.8"

[tool.isort]
profile = "black"
line_length = 120